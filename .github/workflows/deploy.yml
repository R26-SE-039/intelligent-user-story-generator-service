name: CI/CD - Intelligent User Story Generator Service

on:
  push:
    branches:
      - deployment

jobs:
  # ==========================================
  # JOB 1: UNIT TESTS
  # ==========================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx psutil tabulate
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run Unit Tests
        run: |
          pytest tests/unit -v --tb=short
        env:
          ENVIRONMENT: test
          AUTH_SECRET: test-secret-key-for-pytest
          DATABASE_URL: postgresql://mock:mock@localhost:5432/test
          AZURE_SPEECH_KEY: mock-key
          AZURE_SPEECH_REGION: southeastasia
          LLM_API_KEY: mock-llm-key
          MODERNBERT_MODEL_PATH: models/modernbert-utterance-classifier

  # ==========================================
  # JOB 2: INTEGRATION TESTS
  # ==========================================
  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx psutil tabulate
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run Integration Tests
        run: |
          pytest tests/integration -v --tb=short
        env:
          ENVIRONMENT: test
          AUTH_SECRET: test-secret-key-for-pytest
          DATABASE_URL: postgresql://mock:mock@localhost:5432/test
          AZURE_SPEECH_KEY: mock-key
          AZURE_SPEECH_REGION: southeastasia
          LLM_API_KEY: mock-llm-key
          MODERNBERT_MODEL_PATH: models/modernbert-utterance-classifier

  # ==========================================
  # JOB 3: PERFORMANCE SLA BENCHMARK TESTS
  # ==========================================
  performance-sla:
    name: Run Performance SLA Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx psutil tabulate
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run Performance SLA Tests
        run: |
          pytest tests/test_performance_benchmarks.py -v --tb=short
        env:
          ENVIRONMENT: test
          AUTH_SECRET: test-secret-key-for-pytest
          BENCHMARK_API_URL: http://localhost:8001

  # ==========================================
  # JOB 4: 3-STAGE PERFORMANCE EVALUATION
  # ==========================================
  performance-evaluation:
    name: Run 3-Stage Performance Evaluation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil tabulate httpx
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run 3-Stage Performance Evaluation
        run: |
          mkdir -p reports
          python scripts/run_performance_evaluation.py
        env:
          ENVIRONMENT: test
          BENCHMARK_API_URL: http://localhost:8001
          BENCHMARK_API_REQUESTS: "30"
      - name: Publish Report to GitHub Actions Summary
        if: always()
        run: |
          if [ -f reports/PERFORMANCE_REPORT.md ]; then
            cat reports/PERFORMANCE_REPORT.md >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload Performance Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: reports/PERFORMANCE_REPORT.md
          retention-days: 30

  # ==========================================
  # JOB 5: DEPLOY TO AWS EC2
  # ==========================================
  deploy:
    name: Deploy to AWS EC2
    needs: [test, integration-test, performance-sla, performance-evaluation]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deployment' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Starting Automated Deployment on EC2..."
            mkdir -p ~/NextGenQA/intelligent-user-story-generator-service
            cd ~/NextGenQA/intelligent-user-story-generator-service
            if [ ! -d ".git" ]; then
              git clone -b deployment https://github.com/R26-SE-039/intelligent-user-story-generator-service.git .
            else
              git fetch origin deployment
              git reset --hard origin/deployment
            fi
            docker compose up -d --build || docker-compose up -d --build
            docker image prune -f
            echo "Deployment Succeeded!"
